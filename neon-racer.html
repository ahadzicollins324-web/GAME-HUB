<!DOCTYPE html>
<html>
<head>
    <title>Neon Racer</title>
    <style>
        body {
            margin: 0;
            background: #050816;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #35e8ff;
            font-size: 45px;
        }

        #game {
            width: 100%;
            height: 500px;
            background: #111827;
        }
    </style>
</head>

<body>

    <h1>NEON RACER</h1>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = 500;

        ctx.fillStyle = "#0ff";
        ctx.fillRect(
            canvas.width / 2 - 25,
            canvas.height - 100,
            50,
            80
        );
    </script>

</body>
</html>
