<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Racer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050816;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #42e8ff;
            text-shadow: 0 0 15px #42e8ff;
            margin: 15px 0 5px;
        }

        #score {
            font-size: 20px;
            margin-bottom: 10px;
        }

        canvas {
            display: block;
            margin: auto;
            background: #11152b;
            border: 2px solid #42e8ff;
            box-shadow: 0 0 20px #42e8ff;
        }

        .controls {
            margin-top: 15px;
        }

        button {
            width: 100px;
            height: 55px;
            margin: 5px;
            border: none;
            border-radius: 12px;
            background: #42e8ff;
            color: #050816;
            font-size: 25px;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <h1>NEON RACER</h1>

    <div id="score">Score: 0</div>

    <canvas id="game" width="360" height="500"></canvas>

    <div class="controls">
        <button onclick="moveLeft()">⬅</button>
        <button onclick="moveRight()">➡</button>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let car = {
            x: 155,
            y: 420,
            width: 50,
            height: 80
        };

        let enemy = {
            x: Math.random() * 300,
            y: -100,
            width: 50,
            height: 80
        };

        let score = 0;
        let gameOver = false;

        function drawCar() {
            ctx.fillStyle = "#00eaff";
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#00eaff";

            ctx.fillRect(
                car.x,
                car.y,
                car.width,
                car.height
            );

            ctx.shadowBlur = 0;
        }

        function drawEnemy() {
            ctx.fillStyle = "#ff1493";
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#ff1493";

            ctx.fillRect(
                enemy.x,
                enemy.y,
                enemy.width,
                enemy.height
            );

            ctx.shadowBlur = 0;
        }

        function drawRoad() {
            ctx.fillStyle = "#080b18";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#42e8ff";
            ctx.lineWidth = 4;

            ctx.beginPath();
            ctx.moveTo(40, 0);
            ctx.lineTo(40, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(320, 0);
            ctx.lineTo(320, canvas.height);
            ctx.stroke();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;

            for (let y = 0; y < canvas.height; y += 80) {
                ctx.beginPath();
                ctx.moveTo(180, y);
                ctx.lineTo(180, y + 40);
                ctx.stroke();
            }
        }

        function collision() {
            return (
                car.x < enemy.x + enemy.width &&
                car.x + car.width > enemy.x &&
                car.y < enemy.y + enemy.height &&
                car.y + car.height > enemy.y
            );
        }

        function update() {
            if (gameOver) return;

            enemy.y += 5;

            if (enemy.y > canvas.height) {
                enemy.y = -100;
                enemy.x = 50 + Math.random() * 210;
                score++;
                document.getElementById("score").innerText =
                    "Score: " + score;
            }

            if (collision()) {
                gameOver = true;
                alert("GAME OVER! Score: " + score);
                location.reload();
            }
        }

        function draw() {
            drawRoad();
            drawCar();
            drawEnemy();
            update();

            if (!gameOver) {
                requestAnimationFrame(draw);
            }
        }

        function moveLeft() {
            if (car.x > 45) {
                car.x -= 40;
            }
        }

        function moveRight() {
            if (car.x < 265) {
                car.x += 40;
            }
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowLeft") {
                moveLeft();
            }

            if (event.key === "ArrowRight") {
                moveRight();
            }
        });

        draw();
    </script>

</body>
</html>
