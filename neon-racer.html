<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Racer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080018;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      color: #00ffff;
      text-shadow: 0 0 15px #00ffff;
    }

    .game {
      width: 320px;
      height: 500px;
      margin: 20px auto;
      background: #111;
      border: 3px solid #00ffff;
      box-shadow: 0 0 25px #00ffff;
      position: relative;
      overflow: hidden;
    }

    .road {
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        #222 0px,
        #222 40px,
        #333 40px,
        #333 80px
      );
    }

    .car {
      position: absolute;
      bottom: 25px;
      left: 135px;
      width: 50px;
      height: 80px;
      background: #ff0055;
      border-radius: 10px;
      box-shadow: 0 0 20px #ff0055;
    }

    .car::before {
      content: "";
      position: absolute;
      width: 30px;
      height: 25px;
      background: #00ffff;
      left: 10px;
      top: 10px;
      border-radius: 5px;
    }

    .controls {
      margin: 20px;
    }

    button {
      padding: 15px 25px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      background: #00ffff;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px #00ffff;
    }

    button:hover {
      transform: scale(1.05);
    }

    .back {
      background: #ff0055;
      color: white;
      box-shadow: 0 0 15px #ff0055;
    }
  </style>
</head>

<body>

  <h1>🏎️ NEON RACER</h1>

  <div class="game">
    <div class="road"></div>
    <div class="car" id="car"></div>
  </div>

  <div class="controls">
    <button onclick="moveLeft()">⬅ LEFT</button>
    <button onclick="moveRight()">RIGHT ➡</button>
  </div>

  <button class="back" onclick="goBack()">← BACK TO GAMES</button>

  <script>
    const car = document.getElementById("car");
    let position = 135;

    function moveLeft() {
      position -= 30;

      if (position < 10) {
        position = 10;
      }

      car.style.left = position + "px";
    }

    function moveRight() {
      position += 30;

      if (position > 260) {
        position = 260;
      }

      car.style.left = position + "px";
    }

    function goBack() {
      window.location.href = "games.html";
    }
  </script>

</body>
</html>
